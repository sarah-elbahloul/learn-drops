<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <!-- This recreates your exact "shadow-sticker" Tailwind class -->
    <filter id="shadow-sticker" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- rotate-[-4deg] applied to the whole group -->
  <g transform="rotate(-4 20 20)">
    
    <!-- The Yellow Background -->
    <rect x="2" y="2" width="36" height="36" rx="16" fill="#FFD84D" filter="url(#shadow-sticker)"/>
    
    <!-- The Droplet Icon (x=10, y=10 puts it in the exact center) -->
    <svg x="10" y="10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
      <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
    </svg>
    
  </g>
</svg>